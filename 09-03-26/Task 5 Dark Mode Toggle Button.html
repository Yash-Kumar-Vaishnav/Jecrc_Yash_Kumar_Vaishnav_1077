<!DOCTYPE html>
<html>
<head>
    <title>Dark Mode Toggle</title>

    <style>
        .dark{
            background:black;
            color:white;
        }
    </style>

</head>

<body>

    <button id="darkMode">Toggle Dark Mode</button>

    <script>

        // Arrow function event listener
        document.getElementById("darkMode").addEventListener("click", () => {
            document.body.classList.toggle("dark");
        });

    </script>

</body>
</html>
