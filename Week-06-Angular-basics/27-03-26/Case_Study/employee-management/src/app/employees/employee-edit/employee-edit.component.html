<section class="form-page">
	<form class="form-card" (ngSubmit)="update()">
		<h2>Edit Employee</h2>

		<label for="id">ID</label>
		<input id="id" name="id" [ngModel]="employee.id" readonly />

		<label for="name">Name</label>
		<input id="name" name="name" [(ngModel)]="employee.name" required />

		<label for="role">Role</label>
		<input id="role" name="role" [(ngModel)]="employee.role" required />

		<div class="actions">
			<button type="submit" class="btn primary">Update</button>
			<a routerLink="/employees" class="btn">Cancel</a>
		</div>
	</form>
</section>
